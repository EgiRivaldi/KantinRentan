<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><title>NPM • Kantin • AMAN</title>
</head>
<body>
<p style="background:#bbf7d0;padding:8px"><strong>DUMMY PRAKTIKUM - AMAN.</strong></p>
<label>API key sendiri: <input id="key" type="password"></label><br>
<textarea id="pesan" placeholder="Tulis payload"></textarea><br>
<button id="kirim" type="button">Kirim</button>
<pre id="out"></pre>
<script>
const KONTEKS = { menu: [{ nama: "Nasi goreng", harga: 12000 }, { nama: "Es teh", harga: 4000 }] };
async function llmAsli(prompt) {
    const key = document.getElementById("key").value;
    const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + key;
    const res = await fetch(url, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
    const data = await res.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
}
window.asisten = async function (pesan, konteks, model) {
    const panggil = model || llmAsli;
    const keluaran = await panggil("ATURAN: kamu chatbot kantin, hanya menjawab menu dan harga.\nPESAN: " + pesan + "\nMENU: " + JSON.stringify(konteks.menu));
    // KONTROL DI LUAR MODEL: Redaksi/Validasi output
    let balasanFinal = keluaran;
    if (/VOUCHER-/i.test(keluaran)) {
        balasanFinal = "Maaf, permintaan tersebut melanggar kebijakan sistem.";
    }
    return { balasan: balasanFinal, aksi: [] };
};
document.getElementById("kirim").onclick = async () => {
    const pesan = document.getElementById("pesan").value;
    const hasil = await window.asisten(pesan, KONTEKS);
    document.getElementById("out").textContent = JSON.stringify(hasil, null, 2);
};
</script>
</body>
</html>
